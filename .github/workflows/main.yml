name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  selective:
    runs-on: ubuntu-24.04
    name: Selective
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the pinned transport
        run: bash bin/get_transport

      - name: Setup Selective
        uses: selectiveci/setup-selective@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          runner-id: ${{ matrix.ci_node_index }}

      - name: Run the default task
        run: bundle exec selective rspec --log

      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.ci_node_index }}
          path: ./log/*.log

  simplicity:
    runs-on: ubuntu-24.04
    name: Simplicity
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Reject sleep-polling timers and direct ENV writes in specs
        run: bash bin/simplicity-check
