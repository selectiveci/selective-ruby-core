name: Multi Ruby Matrix

on:
  workflow_dispatch:
    inputs:
      without_selective:
        description: Run plain rspec, as a fork PR without secrets would
        type: boolean
        default: false
  pull_request:

jobs:
  multi-ruby-rspec:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0.7"
        runners: [1, 2]

    env:
      SELECTIVE_API_KEY: ${{ secrets.SELECTIVE_API_KEY }}
      SELECTIVE_RUN_ID: ${{ github.run_id }}-${{ matrix.ruby }}
      SELECTIVE_RUN_ATTEMPT: ${{ github.run_attempt }}
      SELECTIVE_RUNNER_ID: ${{ matrix.ruby }}-${{ matrix.runners }}
      SELECTIVE_PR_TITLE: ${{ github.event.pull_request.title }}
      CLONE_PAT: ${{ secrets.CLONE_PAT }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true

      - name: Run the default task
        shell: bash
        env:
          SELECTIVE_TEST_MAP_DISABLE: "1"
          WITHOUT_SELECTIVE: ${{ inputs.without_selective || secrets.SELECTIVE_API_KEY == '' }}
          RUNNER: ${{ matrix.runners }}
        run: |
          if [[ "$WITHOUT_SELECTIVE" != "true" ]]; then
            echo selective > run-mode
            bundle exec selective rspec 2>&1 | tee selective-output.log
          elif [[ "$RUNNER" == "1" ]]; then
            echo plain > run-mode
            env -u SELECTIVE_API_KEY bundle exec rspec 2>&1 | tee selective-output.log
          else
            echo idle > run-mode
            echo "No Selective: runner 1 runs the whole suite with plain rspec" | tee selective-output.log
          fi

      - name: Record this runner's example count
        shell: bash
        run: |
          mkdir -p example-counts
          mode=$(cat run-mode)
          suite=$(bundle exec rspec --dry-run 2>/dev/null | .github/scripts/runner_example_count /dev/stdin)
          if [[ "$mode" == "idle" ]]; then
            ran=0
          else
            ran=$(.github/scripts/runner_example_count selective-output.log)
          fi
          echo "$mode: ran $ran of a $suite-example suite"
          if [[ "$mode" == "plain" && "$ran" != "$suite" ]]; then
            echo "plain rspec must run the whole suite" >&2
            exit 1
          fi
          echo "$ran $suite" > "example-counts/${{ matrix.ruby }}-${{ matrix.runners }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: example-count-${{ matrix.ruby }}-${{ matrix.runners }}
          path: example-counts/

  every-cell-ran-the-suite:
    runs-on: ubuntu-latest
    needs: multi-ruby-rspec
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: example-count-*
          path: example-counts
          merge-multiple: true

      - name: Fail if any Ruby ran less than the full suite
        shell: bash
        run: .github/scripts/check_cell_totals example-counts 2
